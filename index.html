<!doctype html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />

    <!-- Website favicon -->
<link 
  rel="icon" 
  type="image/png" 
  href="/logo.png" 
/>


<!-- Apple / Mobile icon -->
<link 
  rel="apple-touch-icon" 
  href="/logo.png" 
/>
    <!-- Browser fallback -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- Mobile / Apple devices -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0" 
    />

    <!-- SEO -->
    <meta
      name="description"
      content="Aura Design Hub is a premium creative studio specializing in branding, graphic design, and professional print solutions."
    />

    <meta
      name="keywords"
      content="Aura Design Hub, branding, graphic design, logo design, print design, creative studio"
    />

    <!-- Open Graph (when sharing links) -->
    <meta property="og:title" content="Aura Design Hub" />

    <meta
      property="og:description"
      content="Creating premium brands through strategy, creativity, and visual storytelling."
    />

    <meta
      property="og:image"
      content="/og-image.jpg"
    />

    <meta property="og:type" content="website" />


    <!-- Twitter / X sharing -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Aura Design Hub"
    />

    <meta
      name="twitter:description"
      content="Premium branding, graphic design, and print solutions."
    />

    <meta
      name="twitter:image"
      content="/og-image.jpg"
    />


    <title>
      Aura Design Hub | Premium Creative Studio
    </title>

  </head>


  <body>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

  </body>

</html>
